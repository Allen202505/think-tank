[package]
name = "think-tank-widget"
version = "0.1.0"
description = "大师吵股 · 桌面组件"
edition = "2021"

[lib]
name = "think_tank_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
